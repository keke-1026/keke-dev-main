<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121212">
  <title>keke-dev.net</title>
  <link rel="icon" href="favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@200;300;400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg: #121212;
      --panel: #1a1a1a;
      --text: #eeeeee;
      --line: #2e2e2e;
      --glow1: rgba(90, 120, 255, 0.12);
      --glow2: rgba(255, 120, 170, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-weight: 300;
      background: var(--bg);
      color: var(--text);
      text-align: left;
      line-height: 1.8;
      display: flex; flex-direction: column;
      height: 100vh; height: 100dvh;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(60vmax 60vmax at 105% -10%, var(--glow1), transparent 60%),
        radial-gradient(50vmax 50vmax at -10% 110%, var(--glow2), transparent 60%);
    }
    a { color: inherit; }
    button, input { font-family: inherit; font-weight: inherit; color: inherit; outline: none; }
    .material-symbols-outlined { font-size: 18px; vertical-align: middle; }

    .icon-btn { background: none; border: none; padding: 4px; cursor: pointer; display: inline-flex; align-items: center; opacity: 0.8; }
    .icon-btn:hover:not(:disabled) { opacity: 0.5; }
    .icon-btn:disabled { opacity: 0.2; cursor: default; }

    .keepandroidopen { width: 100%; flex: none; }
    .keepandroidopen .kao-banner { width: 100% !important; box-sizing: border-box !important; }

    .stage {
      flex: 1; min-height: 0; position: relative;
      display: grid; grid-template-columns: minmax(240px, 340px) 1fr; gap: 60px;
      padding: 48px 56px;
    }
    .side { display: flex; flex-direction: column; min-height: 0; }
    .main { position: relative; min-height: 0; }

    h1 { font-weight: 200; font-size: 30px; letter-spacing: 3px; margin: 0; }
    #tagline { font-size: 13px; opacity: 0.55; margin-top: 4px; min-height: 1.8em; }

    nav { margin-top: 48px; display: flex; flex-direction: column; gap: 6px; }
    .nav-btn {
      background: none; border: none; padding: 4px 0; cursor: pointer; text-align: left;
      display: flex; align-items: baseline; gap: 14px; font-size: 20px; font-weight: 300;
      opacity: 0.35; transition: opacity 0.3s, transform 0.3s;
    }
    .nav-btn[hidden] { display: none; }
    .nav-btn .num { font-size: 11px; letter-spacing: 1px; width: 18px; }
    .nav-btn:hover { opacity: 0.7; }
    .nav-btn.active { opacity: 1; transform: translateX(8px); }

    .side-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
    .counter img { height: 65px; object-fit: contain; display: block; }
    .footer { font-size: 11px; opacity: 0.55; line-height: 1.7; }
    .commit-id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.5px; text-decoration: none; }
    .commit-id:hover { text-decoration: underline; }
    .commit-id[hidden] { display: none; }

    .panel {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      opacity: 0; visibility: hidden; transform: translateY(14px);
      transition: opacity 0.45s ease, transform 0.45s ease, visibility 0.45s;
      overflow-y: auto; scrollbar-width: none; padding-top: 6px;
    }
    .panel::-webkit-scrollbar { display: none; }
    .panel.active { opacity: 1; visibility: visible; transform: none; }
    .label { font-size: 12px; opacity: 0.6; letter-spacing: 1px; margin-bottom: 22px; }
    .muted { font-size: 14px; opacity: 0.5; }

    .about-text { max-width: 560px; font-size: 16px; }
    .about-text p { margin: 0 0 1em; white-space: pre-wrap; }
    .about-text p:last-child { margin-bottom: 0; }
    .about-text h3 { margin: 22px 0 6px; font-size: 12px; font-weight: 400; opacity: 0.6; letter-spacing: 1px; }
    .about-text h3:first-child { margin-top: 0; }
    .about-text img { display: block; max-width: 100%; height: auto; border-radius: 8px; }
    .about-text figure { margin: 0 0 1em; }
    .about-text figcaption { font-size: 12px; opacity: 0.55; margin-top: 6px; }
    .skills { margin-top: 18px; font-size: 12px; opacity: 0.5; }

    .works-grid {
      flex: 1; min-height: 0; display: grid; align-content: start;
      grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px 48px;
    }
    .work { display: flex; flex-direction: column; gap: 4px; animation: rise 0.45s ease both; }
    .work .idx { font-size: 11px; opacity: 0.4; letter-spacing: 1px; }
    .work .name { font-size: 20px; font-weight: 400; }
    .work .thumb { display: block; width: 100%; max-height: 160px; object-fit: cover; border-radius: 8px; margin: 4px 0; background: #222; }
    .work .desc {
      font-size: 14px; opacity: 0.7;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .work .open { font-size: 13px; margin-top: 4px; opacity: 0.8; width: fit-content; }
    .work .open:hover { opacity: 0.5; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .pager { flex: none; display: flex; align-items: center; gap: 10px; margin-top: 20px; font-size: 13px; }
    .pager .count { opacity: 0.6; min-width: 48px; text-align: center; }
    .pager-all { margin-left: auto; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; opacity: 0.8; }
    .pager-all:hover { opacity: 0.5; }

    .links-list { display: flex; flex-direction: column; max-width: 520px; }
    .link-row {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 14px 0; border-bottom: 1px solid var(--line); text-decoration: none; font-size: 17px;
      transition: padding 0.25s, opacity 0.25s;
    }
    .link-row:hover { padding-left: 10px; opacity: 0.6; }
    .link-row .material-symbols-outlined { opacity: 0.5; }

    .activity-sub { font-size: 12px; opacity: 0.45; margin: -14px 0 18px; }
    .activity-list { display: flex; flex-direction: column; max-width: 640px; }
    .commit {
      display: flex; align-items: baseline; justify-content: space-between; gap: 18px;
      padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; font-size: 15px;
      animation: rise 0.45s ease both; transition: padding 0.25s, opacity 0.25s;
    }
    .commit:hover { padding-left: 10px; opacity: 0.6; }
    .commit .msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .commit .meta { font-size: 12px; opacity: 0.5; flex: none; }

    @media (max-width: 700px) {
      .stage { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; gap: 0; padding: 22px 22px 16px; }
      .side { display: contents; }
      .side-head { grid-row: 1; }
      h1 { font-size: 24px; }
      nav { grid-row: 2; flex-direction: row; flex-wrap: wrap; gap: 4px 16px; margin: 18px 0 22px; }
      .nav-btn { font-size: 15px; }
      .nav-btn .num { display: none; }
      .nav-btn.active { transform: none; border-bottom: 1px solid currentColor; }
      .main { grid-row: 3; }
      .side-bottom { grid-row: 4; margin-top: 14px; gap: 8px; }
      .counter img { height: 12px; }
      .works-grid { grid-template-columns: 1fr; gap: 22px; }
      .work .name { font-size: 18px; }
      .about-text { font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .panel, .nav-btn, .work, .commit { transition: none; animation: none; }
    }
  </style>
</head>
<body>
  <div class="keepandroidopen">
    <script src="https://keepandroidopen.org/banner.js?lang=ja&size=mini&id=keke-dev"></script>
  </div>

  <div class="stage">
    <div class="side">
      <div class="side-head">
        <h1>keke-dev.net</h1>
        <div id="tagline"></div>
      </div>

      <nav>
        <button class="nav-btn active" data-target="about"></span>私について</button>
        <button class="nav-btn" data-target="works"></span>制作物</button>
        <button class="nav-btn" data-target="links"></span>リンク</button>
        <button class="nav-btn" data-target="likes"></span>好きなこと</button>
      </nav>

      <div class="side-bottom">
        <div class="counter">
          <img src="http://counter.linkserver.jp/@public_main?name=public_main&theme=miku&padding=6&offset=0&align=top&scale=1&pixelated=1&darkmode=auto" alt="カウンター">
        </div>
        <div class="footer">&copy; 2026 keke-dev.net<br><a class="commit-id" id="commit-id" href="#" target="_blank" rel="noopener" hidden></a></div>
      </div>
    </div>

    <div class="main">
      <section class="panel active" id="panel-about">
        <div class="label">私について</div>
        <div id="about-container"></div>
      </section>

      <section class="panel" id="panel-works">
        <div class="label">制作物</div>
        <div class="works-grid" id="works-grid"></div>
        <div class="pager" id="pager">
          <button class="icon-btn" id="prev" aria-label="前へ"><span class="material-symbols-outlined">chevron_left</span></button>
          <span class="count" id="page-count"></span>
          <button class="icon-btn" id="next" aria-label="次へ"><span class="material-symbols-outlined">chevron_right</span></button>
          <a class="pager-all" href="to-project.html" target="_blank">作品一覧 <span class="material-symbols-outlined">arrow_forward</span></a>
        </div>
      </section>

      <section class="panel" id="panel-links">
        <div class="label">リンク</div>
        <div class="links-list" id="links-list"></div>
      </section>

      <section class="panel active" id="panel-likes">
        <div class="label">好きなこと</div>
        <div id="likes-container"></div>
      </section>
    </div>
  </div>

  <script src="selfxss.js"></script>
  <script>
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const $ = id => document.getElementById(id);

    const REPO = 'keke-1026/keke-dev.net';
    const FORM_URL = 'mailto:keikeiy1026@gmail.com';

    const safeUrl = x => {
      try { const p = new URL(x, location.href); return /^(https?:|mailto:)$/.test(p.protocol) ? p.href : null; }
      catch (e) { return null; }
    };
    const hrefOf = x => esc(safeUrl(x) || '#');
    const SECTIONS = ['about', 'works', 'links', 'music-game'];
    const sectionList = () => SECTIONS;
    let current = 'about';
    function show(name, pushHash = true) {
      if (!sectionList().includes(name)) return;
      current = name;
      document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.target === name));
      if (pushHash) { try { history.replaceState(null, '', '#' + name); } catch (e) {} }
      if (name === 'activity') loadActivity();
    }
    document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', e => { show(b.dataset.target); e.currentTarget.blur(); }));

    let works = [], page = 0;
    const mqMobile = window.matchMedia('(max-width: 700px)');
    const perPage = () => mqMobile.matches ? 2 : 4;
    function renderWorks() {
      const grid = $('works-grid'), pager = $('pager');
      const per = perPage(), pages = Math.max(1, Math.ceil(works.length / per));
      page = Math.max(0, Math.min(page, pages - 1));
      const slice = works.slice(page * per, page * per + per);
      grid.innerHTML = slice.map((w, i) =>
        `<div class="work" style="animation-delay:${i * 60}ms">
           <span class="idx">${String(page * per + i + 1).padStart(2, '0')}</span>
           <span class="name">${esc(w.title)}</span>
           ${w.image && safeUrl(w.image) ? `<img class="thumb" src="${esc(safeUrl(w.image))}" alt="${esc(w.alt || w.title)}" loading="lazy">` : ''}
           <span class="desc">${esc(w.description)}</span>
           <a class="open" href="${hrefOf(w.link)}" target="_blank" rel="noopener">開く</a>
         </div>`).join('');
      $('page-count').textContent = `${page + 1} / ${pages}`;
      $('prev').disabled = page === 0;
      $('next').disabled = page >= pages - 1;
      const vis = pages > 1 ? 'visible' : 'hidden';
      $('prev').style.visibility = $('next').style.visibility = $('page-count').style.visibility = vis;
    }
    function turn(d) { page += d; renderWorks(); }
    $('prev').addEventListener('click', e => { turn(-1); e.currentTarget.blur(); });
    $('next').addEventListener('click', e => { turn(1); e.currentTarget.blur(); });
    mqMobile.addEventListener('change', renderWorks);

    let activityLoaded = false;
    function relTime(iso) {
      const diff = (new Date(iso).getTime() - Date.now()) / 1000;
      const rtf = new Intl.RelativeTimeFormat('ja', { numeric: 'auto' });
      const units = [['year', 31536000], ['month', 2592000], ['day', 86400], ['hour', 3600], ['minute', 60]];
      for (const [u, s] of units) if (Math.abs(diff) >= s) return rtf.format(Math.round(diff / s), u);
      return 'たった今';
    }
    function renderCommits(list) {
      if (!list.length) { $('activity-list').innerHTML = '<div class="muted">コミットがありません</div>'; return; }
      $('activity-list').innerHTML = list.map((c, i) => {
        const msg = (c.commit.message || '').split('\n')[0];
        return `<a class="commit" style="animation-delay:${i * 50}ms" href="${esc(c.html_url)}" target="_blank" rel="noopener">
                  <span class="msg">${esc(msg)}</span>
                  <span class="meta">${esc(c.sha.slice(0, 7))} · ${esc(relTime(c.commit.author.date))}</span>
                </a>`;
      }).join('');
    }
    async function getCommits() {
      try {
        const c = JSON.parse(sessionStorage.getItem('gh_commits') || 'null');
        if (c && Date.now() - c.t < 10 * 60 * 1000) return c.data;
      } catch (e) {}
      const r = await fetch(`https://api.github.com/repos/${REPO}/commits?per_page=6`, { headers: { Accept: 'application/vnd.github+json' } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      try { sessionStorage.setItem('gh_commits', JSON.stringify({ t: Date.now(), data })); } catch (e) {}
      return data;
    }
    async function loadActivity() {
      if (activityLoaded) return;
      activityLoaded = true;
      $('activity-list').innerHTML = '<div class="muted">読み込み中…</div>';
      try {
        renderCommits(await getCommits());
      } catch (e) {
        activityLoaded = false;
        $('activity-list').innerHTML = '<div class="muted">取得できませんでした</div>';
      }
    }

    async function showCommitId() {
      try {
        const list = await getCommits();
        const c = list && list[0];
        if (!c || !c.sha) return;
        const a = $('commit-id');
        a.textContent = c.sha.slice(0, 7);
        a.href = safeUrl(c.html_url) || ('https://github.com/' + REPO);
        a.title = (c.commit.message || '').split('\n')[0];
        a.hidden = false;
      } catch (e) {}
    }

    function aboutImage(p) {
      const src = safeUrl(p.image);
      if (!src) return '';
      const w = Number(p.width);
      const img = `<img src="${esc(src)}" alt="${esc(p.alt || '')}" loading="lazy"${w > 0 ? ` style="max-width:min(100%, ${Math.round(w)}px)"` : ''}>`;
      const inner = p.link && safeUrl(p.link) ? `<a href="${hrefOf(p.link)}" target="_blank" rel="noopener">${img}</a>` : img;
      return `<figure>${inner}${p.caption ? `<figcaption>${esc(p.caption)}</figcaption>` : ''}</figure>`;
    }

    fetch('data.json')
      .then(r => r.json())
      .then(d => {
        if (d.heroTitles && d.heroTitles.length) {
          $('tagline').textContent = d.heroTitles[Math.floor(Math.random() * d.heroTitles.length)];
        }

        if (d.about) {
          const a = d.about;
          const paras = a.paragraphs || (a.text ? String(a.text).split(/\n{2,}/) : []);
          const body = paras.map(p => {
            if (typeof p === 'string') return `<p>${p}</p>`;
            if (p.image) return aboutImage(p);
            return `${p.heading ? `<h3>${esc(p.heading)}</h3>` : ''}<p>${p.text ?? ''}</p>`;
          }).join('');
          $('about-container').innerHTML =
            `<div class="about-text">${body}</div>` +
            ((a.skills || []).length ? `<div class="skills">${a.skills.map(esc).join(' / ')}</div>` : '');
        }

        works = d.works || [];
        renderWorks();
        const links = (d.relatedLinks || []).map(l =>
          `<a class="link-row" href="${hrefOf(l.url)}" target="_blank" rel="noopener"><span>${esc(l.title)}</span><span class="material-symbols-outlined">${esc(l.icon || 'arrow_outward')}</span></a>`);
        links.push(`<a class="link-row" href="${FORM_URL}" target="_blank" rel="noopener"><span>お問い合わせ</span><span class="material-symbols-outlined">mail</span></a>`);
        $('links-list').innerHTML = links.join('');
      })
      .catch(() => console.log('data.json not found'));

    renderWorks();
    showCommitId();
    const h = location.hash.replace('#', '');
    if (SECTIONS.includes(h)) show(h, false);
  </script>
</body>
</html>
